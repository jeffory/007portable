plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ge007.port'
    compileSdk 34

    defaultConfig {
        applicationId "com.ge007.port"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
