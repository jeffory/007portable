# GoldenEye 007 PC port — input bindings
# action = key[, key...]   keys are SDL scancode names ("W", "Left Shift",
# "Return", "Keypad 5", ...) or Mouse1..Mouse5. Up to 4 per action.
# Delete this file to regenerate the defaults.

# move forward
forward = W

# move back
back = S

# move left (strafe under mouselook, turn otherwise)
left = A

# move right
right = D

# fire (Z trigger)
fire = Space, Mouse1

# aim (R trigger)
aim = E, Mouse2

# A button (accept / cycle weapon)
a = X, F

# B button (reload / open doors / activate)
b = C, R

# Start (pause)
start = Return

# L shoulder button
l = Q

# C up (raw)
c_up = I

# C down (raw)
c_down = K

# C left (raw)
c_left = J

# C right (raw)
c_right = L

# analog stick up (raw)
stick_up = Up

# analog stick down (raw)
stick_down = Down

# analog stick left (raw)
stick_left = Left

# analog stick right (raw)
stick_right = Right

# toggle the mouselook grab
grab_toggle = F1

# next weapon (scrollwheel up always works)
weapon_next = ]

# previous weapon (scrollwheel down always works)
weapon_prev = [

# select weapon slot 1
weapon1 = 1

# select weapon slot 2
weapon2 = 2

# select weapon slot 3
weapon3 = 3

# select weapon slot 4
weapon4 = 4

# select weapon slot 5
weapon5 = 5

# select weapon slot 6
weapon6 = 6

# select weapon slot 7
weapon7 = 7

# select weapon slot 8
weapon8 = 8

# select weapon slot 9
weapon9 = 9

# select weapon slot 10
weapon10 = 0

# mouselook (PORT_MOUSE_SENS / PORT_MOUSE_INVERT env vars override)
sensitivity = 2.0
invert = 0
