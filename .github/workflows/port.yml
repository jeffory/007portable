name: port

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'port/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/port.yml'
  pull_request:

# ROM-gated tests (port/tests/run_goldens.sh) run locally before push; CI
# proves the build matrix compiles and links warning-clean, and that the
# generated sources are in sync with their generators.

jobs:
  build-i686:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 32-bit toolchain + SDL2
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ gcc-multilib g++-multilib \
            libsdl2-dev:i386 libgl1-mesa-dev:i386 || \
          sudo apt-get install -y cmake ninja-build gcc g++ gcc-multilib g++-multilib

      - name: Check generated sources are current
        run: |
          cp port/include/rom_offsets.h /tmp/rom_offsets.committed
          python3 port/tools/gen_rom_symbols.py
          diff -u /tmp/rom_offsets.committed port/include/rom_offsets.h

      - name: Configure
        run: cmake -B build -G Ninja --toolchain port/cmake/i686-toolchain.cmake

      - name: Build
        run: ninja -C build | tee /tmp/build.log

      - name: Warning gate
        run: |
          # enum-signedness detector: 5 known always-true-on-IDO-too sites
          # in textrelated.c (see CMakeLists) — the count must not grow
          n=$(grep -c "Wtype-limits" /tmp/build.log || true)
          echo "type-limits warnings: $n (limit 5)"
          test "$n" -le 5

  build-x86-64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain + SDL2
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc g++ libsdl2-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: ninja -C build

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: aarch64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure
        run: cmake -B build-arm64 -G Ninja --toolchain port/cmake/aarch64-toolchain.cmake

      - name: Build
        run: ninja -C build-arm64
        # ROM-gated qemu smoke tests run locally: port/tests/run_arm64.sh

  build-win64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: mingw-w64 toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      # Ubuntu has no mingw SDL2 package; fetch the official mingw devel tarball
      - name: SDL2 mingw devel
        run: |
          curl -sL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz | tar xz
          sudo cp -r SDL2-2.30.9/x86_64-w64-mingw32/* /usr/x86_64-w64-mingw32/

      - name: Configure
        run: cmake -B build-win64 -G Ninja --toolchain port/cmake/mingw64-toolchain.cmake

      - name: Build
        run: ninja -C build-win64
        # ROM-gated Wine smoke test runs locally: port/tests/run_win64.sh

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SDL2 source + Java glue
        run: android/fetch_sdl.sh

      - name: Assemble APK (arm64-v8a)
        run: cd android && gradle assembleDebug --no-daemon

      - name: Check APK contents
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "libmain.so|libSDL2.so"
